name: Deploy to Mintlify
on:
  push:
    branches: ["master"]
    paths: ["docs/**", ".github/workflows/mintlify.yml"]
permissions:
  id-token: write
  contents: read
concurrency:
  group: mintlify-deploy
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npx mint@latest deploy --subdomain audx --directory docs
